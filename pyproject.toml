[project]
name = "accel-switch"
version = "1.4.0"
description = "ComfyUI 顶栏加速切换 + 缩放 + 工作流画布快照/一键还原(参数+旁通+图像+连线+节点位置, 按工作流归属校验) + 服务端参数模板 + 后端合成微基准（纯补丁，无节点）| Switch attention backend, zoom, restore a saved canvas state (params, bypass, images, links and node positions, workflow-scoped), server-side presets, and micro-benchmark"
license = { file = "LICENSE" }
requires-python = ">=3.9"
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/wqy0858/ComfyUI-AccelSwitch"
"Bug Tracker" = "https://github.com/wqy0858/ComfyUI-AccelSwitch/issues"

[tool.comfy]
PublisherId = "wqy0858"
DisplayName = "ComfyUI-AccelSwitch 顶栏加速切换"
Icon = "https://raw.githubusercontent.com/wqy0858/ComfyUI-AccelSwitch/main/icon.svg"
